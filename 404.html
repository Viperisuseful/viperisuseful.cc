<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | Page Not Found</title>
    <link rel="icon" type="image/png" href="resources/Viperisuseful-LOGO.png">
    <link rel="stylesheet" href="style.css?v=1.2.5">
</head>
<body class="helium-theme" data-lanyard-id="990680811827261490">
    <canvas id="starfield"></canvas>

    <header class="site-header">
        <div class="logo-area">
            <div class="logo">
                <a href="/" aria-label="Viperisuseful home">
                    <img src="resources/Viperisuseful-LOGO.png" alt="Logo">
                </a>
                
                <!-- Discord Profile Card Dropdown -->
                <div class="status-dropdown">
                    <div class="profile-banner" id="discord-banner" aria-hidden="true"></div>
                    <div class="profile-header">
                        <div class="avatar-container">
                            <div class="avatar-wrapper">
                                <img id="discord-avatar" src="resources/Viperisuseful-LOGO.png" alt="Avatar">
                            </div>
                            <img id="discord-decoration" class="avatar-decoration" src="" alt="" style="display:none;">
                            <div id="avatar-status-dot" class="avatar-status-dot offline"></div>
                        </div>

                        <div class="profile-header-right">
                            <div class="profile-title-row">
                                <span class="profile-username">viperisuseful</span>
                                <span id="discord-server-badge" class="server-badge" style="display:none;"></span>
                                <span id="discord-server-badge-2" class="server-badge server-badge-icon" style="display:none;"></span>
                                <span id="discord-primary-badge" class="profile-primary-badge" style="display:none;"></span>
                                <div id="discord-clan-tag" class="clan-tag" style="display:none;"></div>
                                <div id="discord-badges" class="profile-badges" aria-hidden="true"></div>
                            </div>
                            <div id="discord-custom-status" class="profile-custom-status" style="display:none;"></div>
                        </div>
                    </div>
                    <div class="profile-body">
                        <div class="profile-divider" aria-hidden="true"></div>
                        <div id="discord-activity" class="profile-activity">
                            <!-- Activity content injected via JS -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <nav class="nav-links">
            <a href="/" class="nav-link">← Back to Home</a>
        </nav>
    </header>

    <main class="redirect-container">
        <div class="error-card glass reveal-on-scroll">
            <h1 class="error-code">404</h1>
            <h2 class="error-title">Page Not Found</h2>
            <p class="error-message">Looks like this page swam away into the deep abyss!</p>
            
            <div class="error-actions">
                <a href="/" class="btn btn-primary">Go Home</a>
                <a href="/quickrunlab/" class="btn btn-ghost">QuickRun Lab</a>
                <a href="/turtlecave/" class="btn btn-ghost">Turtle Cave</a>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
